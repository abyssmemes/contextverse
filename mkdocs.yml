site_name: ContextVerse
site_description: Context as a Service — one context for every AI tool. Self-hosted, vendor-neutral, open source.
site_url: https://orkcom-tech.github.io/contextverse/
repo_url: https://github.com/orkcom-tech/contextverse
repo_name: orkcom-tech/contextverse
edit_uri: edit/main/docs/
copyright: Developed by ORKCOM · BUSL-1.1 — source-available. Each version converts to Apache-2.0 four years after release.

theme:
  name: material
  language: en
  # Teal/ink: the same palette the TUI and the server console use, so the
  # documentation reads as part of the product instead of a default template.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Sections in the sidebar, no tabs: the page count is small enough that
    # tabs would only add a second place to look for the same links.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quickstart: quickstart.md
      - Concepts: concepts.md
  - Using contextd:
      - CLI reference: cli.md
      - Templates: templates.md
  - Running a server:
      - Server: server.md
      - Auth & ACL: auth-acl.md
      - Deploy: deploy.md
  - Project:
      - Changelog: changelog.md
      - Packaging & releases: packaging.md
      - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/orkcom-tech/contextverse
      name: ContextVerse on GitHub
